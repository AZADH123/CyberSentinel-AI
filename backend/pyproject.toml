[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel-ai"
version = "0.1.0"
description = "Evidence-grounded SOC alert triage and investigation prototype"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary portfolio project" }
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "coverage[toml]==7.6.9",
  "hypothesis==6.122.3",
  "respx==0.22.0",
  "ruff==0.8.4",
  "mypy==1.14.0",
]

[tool.setuptools.packages.find]
include = ["cybersentinel*"]

[tool.setuptools.package-data]
cybersentinel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "security: security and trust-boundary tests",
  "integration: database/API integration tests",
  "migration: Alembic migration tests",
]

[tool.coverage.run]
source = ["cybersentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["cybersentinel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]

[tool.mypy]
python_version = "3.12"
files = ["cybersentinel"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["migrations/"]
